name: Pinggan
options:
  bundleIdPrefix: com.ridhuan
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Pinggan:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Pinggan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - Quicksand-Medium.ttf
          - Quicksand-SemiBold.ttf
          - Quicksand-Bold.ttf
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Take photos of your food and food labels.
        NSLocationWhenInUseUsageDescription: Suggests the restaurant you're eating at.
        NSPhotoLibraryUsageDescription: Pick earlier food photos to log.
        NSPhotoLibraryAddUsageDescription: Save your monthly recap to Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridhuan.pinggan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Manual
