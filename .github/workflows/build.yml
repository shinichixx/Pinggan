name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read build number
        id: ver
        run: |
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | sed -E 's/[^0-9]//g')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build $BUILD"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Pinggan.xcodeproj \
            -scheme Pinggan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -n 120 || true
          test -d build/Build/Products/Release-iphoneos/Pinggan.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pinggan.app Payload/
          zip -qry "Pinggan_build${{ steps.ver.outputs.build }}.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pinggan_build${{ steps.ver.outputs.build }}
          path: Pinggan_build${{ steps.ver.outputs.build }}.ipa

      - name: Publish release with the IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ steps.ver.outputs.build }}"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "Pinggan_build${{ steps.ver.outputs.build }}.ipa" \
            --title "Pinggan build ${{ steps.ver.outputs.build }}" \
            --notes "Unsigned IPA for sideloading (AltStore / Sideloadly)."
